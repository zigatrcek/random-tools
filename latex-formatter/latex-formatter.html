<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Formatter</title>
    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />

    <!-- Javascripts -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>


    <!-- Add the missing Diff library with the correct export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/4.0.2/diff.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/diff2html/3.4.35/diff2html.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .file-input {
            margin-bottom: 15px;
        }
        .api-key-input {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .api-key-input input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .output-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tab-container {
            display: flex;
            border-bottom: 1px solid #ddd;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #f1f1f1;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            margin-right: 5px;
        }
        .tab.active {
            background-color: white;
            border-bottom: 1px solid white;
            margin-bottom: -1px;
        }
        .tab-content {
            display: none;
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
        }
        .tab-content.active {
            display: block;
        }
        .loading {
            text-align: center;
            display: none;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3498db;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #errorMessage {
            color: red;
            margin-top: 10px;
            display: none;
        }
        .model-selection {
            margin-bottom: 15px;
        }
        .copy-button {
            padding: 5px 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .settings-button {
            background-color: #f39c12;
            position: fixed;
            right: 20px;
            top: 20px;
            z-index: 1000;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 800px;
            border-radius: 8px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: border-color 0.3s;
            margin-bottom: 15px;
            background-color: #f9f9f9;
        }
        .drop-zone:hover {
            border-color: #3498db;
        }
        .drop-zone.active {
            border-color: #2ecc71;
            background-color: rgba(46, 204, 113, 0.1);
        }
        .file-list {
            margin-top: 10px;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            background-color: #f9f9f9;
        }
        .file-item:hover {
            background-color: #f1f1f1;
        }
        .file-item.active {
            background-color: #e3f2fd;
            border-left: 4px solid #2196F3;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-name {
            flex-grow: 1;
            margin-right: 10px;
        }
        .file-actions {
            display: flex;
            gap: 5px;
        }
        .file-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 10px;
        }
        .status-pending {
            background-color: #ffeaa7;
            color: #d35400;
        }
        .status-processing {
            background-color: #81ecec;
            color: #00505c;
        }
        .status-processed {
            background-color: #55efc4;
            color: #005c4c;
        }
        .status-error {
            background-color: #fab1a0;
            color: #c0392b;
        }
        .batch-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .batch-progress {
            margin-top: 10px;
            display: none;
        }
        .progress-bar {
            height: 10px;
            background-color: #f1f1f1;
            border-radius: 5px;
            margin-bottom: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 12px;
            text-align: center;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #saveChangesBtn {
            background-color: #3498db;
        }
        #saveChangesBtn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <button id="settingsBtn" class="settings-button">Settings</button>
    
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Formatting Instructions</h2>
            <p>Customize the formatting guidelines used by the AI:</p>
            <textarea id="formatInstructions" rows="15" style="width: 100%; margin-bottom: 15px;"></textarea>
            <button id="saveSettingsBtn">Save Settings</button>
            <button id="resetSettingsBtn">Reset to Default</button>
        </div>
    </div>
    
    <h1>LaTeX Formatter</h1>
    
    <div class="container">
        <div class="input-section">
            <h2>Input</h2>
            <!-- New drag and drop zone -->
            <div class="drop-zone" id="dropZone">
                <p>Drag & drop LaTeX files here or click to upload</p>
                <input type="file" id="latexFile" accept=".tex" multiple style="display: none;">
            </div>

            <!-- Batch actions -->
            <div class="batch-actions">
                <button id="formatAllBtn">Format All Files</button>
                <button id="downloadAllBtn" disabled>Download All</button>
                <button id="clearAllBtn">Clear All</button>
            </div>

            <!-- Progress bar for batch processing -->
            <div class="batch-progress" id="batchProgress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Processing 0/0 files...</div>
            </div>

            <!-- File list -->
            <div class="file-list" id="fileList">
                <!-- File items will be added here dynamically -->
            </div>
            <div class="api-key-input">
                <label for="apiKey">Gemini API Key:</label>
                <input type="password" id="apiKey" placeholder="Enter your Gemini API Key">
            </div>
            <div class="model-selection">
                <label for="modelSelect">Gemini Model:</label>
                <select id="modelSelect">
                    <option value="gemini-2.0-flash">gemini-2.0-flash (Fast)</option>
                    <option value="gemini-1.5-pro">gemini-1.5-pro (Powerful)</option>
                </select>
            </div>
            <textarea id="latexInput" placeholder="Or paste your LaTeX content here..."></textarea>
            <div id="errorMessage"></div>
        </div>
        
        <div class="button-container">
            <button id="formatBtn">Format with Gemini</button>
            <button id="clearBtn">Clear</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing your request...</p>
        </div>
        
        <div class="output-section">
            <h2>Output</h2>
            <div class="tab-container">
                <div class="tab active" data-tab="diff">Diff View</div>
                <div class="tab" data-tab="formatted">Formatted LaTeX</div>
                <div class="tab" data-tab="original">Original LaTeX</div>
            </div>
            
            <div class="tab-content active" id="diff-content">
                <div id="diffOutput"></div>
            </div>
            
            <div class="tab-content" id="formatted-content">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button id="copyFormattedBtn" class="copy-button">Copy to Clipboard</button>
                    <button id="saveChangesBtn" class="copy-button">Save Changes</button>
                </div>
                <textarea id="formattedOutput"></textarea>
            </div>
            
            <div class="tab-content" id="original-content">
                <button id="copyOriginalBtn" class="copy-button">Copy to Clipboard</button>
                <textarea id="originalOutput" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        // Default format guidelines
        const DEFAULT_FORMAT_GUIDELINES = `
        Glavno pravilo - spoštuj formatiranje, ki je že v besedilu. Ne dodajaj razlag, samo formatiraj.
        Tekst je lahko hkrati poudarjen in ležeč.
| Syntax | Description |
|--------|-------------|
| \\textsc{"protocol"} | Protokoli se pišejo z malimi črkami z ukazom za male velike črke (udp, tcp, dns...) |
| \\emph{"emphasized word"} | Poudarjene besede so zapisane z ukazom za poudarjanje (sporočilo, geslo, kontrolna vsota glave) |
| \\textit{"translation or explanation"} | Angleški prevodi in razlage okrajšav so zapisane z ukazom za ležeče črke (duplication, multicast, Domain Name System...) |
| number | Številke so napisane z običajnim besedilom (1, 67, 113...) |
| $$"equation"$$ | Enačbe in izračuni so zapisani z ukazom za enačbe (a + b = 1, x² + x + 1 = 0, e = mc²...) |
| \\code{"command"} | Ukazi in kratka programska koda znotraj besedila je zapisana z ukazom za programsko kodo (snmpwalk, if a > 1, echo "Test"...) |
| \\begin{lstlisting}"command"\\end{lstlisting} | Ukazi in kratka programska koda izven besedila je zapisana z ukazom za programsko kodo (snmpwalk, if a > 1, echo "Test"...) |
| \\texttt{"ip, url or file name"} | Naslovi IP, URL-ji, imena datotek so zapisani z ukazom za tipkarske črke (192.168.1.1, www.example.com, dhcpd.conf) |
        `;

        document.addEventListener('DOMContentLoaded', () => {
            const latexInput = document.getElementById('latexInput');
            const formatBtn = document.getElementById('formatBtn');
            const clearBtn = document.getElementById('clearBtn');
            const latexFile = document.getElementById('latexFile');
            const formattedOutput = document.getElementById('formattedOutput');
            const originalOutput = document.getElementById('originalOutput');
            const diffOutput = document.getElementById('diffOutput');
            const apiKeyInput = document.getElementById('apiKey');
            const modelSelect = document.getElementById('modelSelect');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');
            const copyFormattedBtn = document.getElementById('copyFormattedBtn');
            const copyOriginalBtn = document.getElementById('copyOriginalBtn');
            const targetElement = document.getElementById('diffOutput');
            
            // Settings modal elements
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsModal = document.getElementById('settingsModal');
            const closeBtn = document.querySelector('.close');
            const saveSettingsBtn = document.getElementById('saveSettingsBtn');
            const resetSettingsBtn = document.getElementById('resetSettingsBtn');
            const formatInstructions = document.getElementById('formatInstructions');

            const formatAllBtn = document.getElementById('formatAllBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const dropZone = document.getElementById('dropZone');
            const fileList = document.getElementById('fileList');
            const batchProgress = document.getElementById('batchProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            const saveChangesBtn = document.getElementById('saveChangesBtn');

            const files = [];
            let activeFileId = null;
            let batchProcessing = false;
            
            // Load API key from localStorage if available
            if (localStorage.getItem('geminiApiKey')) {
                apiKeyInput.value = localStorage.getItem('geminiApiKey');
            }
            
            // Load selected model from localStorage if available
            if (localStorage.getItem('geminiModel')) {
                modelSelect.value = localStorage.getItem('geminiModel');
            }
            
            // Load format instructions from localStorage or use default
            if (localStorage.getItem('formatInstructions')) {
                formatInstructions.value = localStorage.getItem('formatInstructions');
            } else {
                formatInstructions.value = DEFAULT_FORMAT_GUIDELINES;
                localStorage.setItem('formatInstructions', DEFAULT_FORMAT_GUIDELINES);
            }
            
            // Settings modal functionality
            settingsBtn.addEventListener('click', () => {
                settingsModal.style.display = 'block';
            });
            
            closeBtn.addEventListener('click', () => {
                settingsModal.style.display = 'none';
            });
            
            window.addEventListener('click', (event) => {
                if (event.target === settingsModal) {
                    settingsModal.style.display = 'none';
                }
            });
            
            saveSettingsBtn.addEventListener('click', () => {
                localStorage.setItem('formatInstructions', formatInstructions.value);
                settingsModal.style.display = 'none';
            });
            
            resetSettingsBtn.addEventListener('click', () => {
                formatInstructions.value = DEFAULT_FORMAT_GUIDELINES;
                localStorage.setItem('formatInstructions', DEFAULT_FORMAT_GUIDELINES);
            });

            // Copy buttons
            copyFormattedBtn.addEventListener('click', () => {
                formattedOutput.select();
                document.execCommand('copy');
                copyFormattedBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyFormattedBtn.textContent = 'Copy to Clipboard';
                }, 2000);
            });

            copyOriginalBtn.addEventListener('click', () => {
                originalOutput.select();
                document.execCommand('copy');
                copyOriginalBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyOriginalBtn.textContent = 'Copy to Clipboard';
                }, 2000);
            });
            // File upload handling
            dropZone.addEventListener('click', () => {
                latexFile.click();
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('active');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('active');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('active');
                
                if (e.dataTransfer.files.length > 0) {
                    Array.from(e.dataTransfer.files).forEach(file => {
                        if (file.name.endsWith('.tex')) {
                            addFile(file);
                        }
                    });
                }
            });

            latexFile.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    Array.from(e.target.files).forEach(file => {
                        if (file.name.endsWith('.tex')) {
                            addFile(file);
                        }
                    });
                }
            });

            // Tab switching functionality
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    tab.classList.add('active');
                    const tabId = tab.getAttribute('data-tab');
                    document.getElementById(`${tabId}-content`).classList.add('active');
                });
            });
            
            // Handle file upload
            latexFile.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        latexInput.value = e.target.result;
                    };
                    reader.readAsText(file);
                }
            });
            
            // Format button click handler
            formatBtn.addEventListener('click', () => {
                if (activeFileId) {
                    formatCurrentFile();
                } else {
                    // Handle manual input case (no file selected)
                    const content = latexInput.value.trim();
                    if (!content) {
                        showError("Please enter some LaTeX content");
                        return;
                    }
                    
                    // Create a temporary file
                    const fileId = 'file-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
                    const fileObj = {
                        id: fileId,
                        name: 'Manual Input',
                        originalContent: content,
                        formattedContent: null,
                        status: 'pending',
                        errorMessage: null
                    };
                    
                    files.push(fileObj);
                    activeFileId = fileId;
                    renderFileList();
                    formatCurrentFile();
                }
            });

            // Format All button click handler
            formatAllBtn.addEventListener('click', formatAllFiles);

            // Save Changes button click handler
            saveChangesBtn.addEventListener('click', saveFormattedChanges);

            // Add keyboard shortcut for saving (Ctrl+S)
            formattedOutput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault(); // Prevent browser save dialog
                    saveFormattedChanges();
                }
            });

            // Clear All button click handler
            clearAllBtn.addEventListener('click', () => {
                files.length = 0;
                activeFileId = null;
                latexInput.value = '';
                formattedOutput.value = '';
                originalOutput.value = '';
                diffOutput.innerHTML = '';
                renderFileList();
            });
            
            // Clear button click handler
            clearBtn.addEventListener('click', () => {
                latexInput.value = '';
                formattedOutput.value = '';
                originalOutput.value = '';
                diffOutput.innerHTML = '';
                latexFile.value = '';
                errorMessage.style.display = 'none';
            });
            // Download All button click handler
            downloadAllBtn.addEventListener('click', downloadAllFiles);
            
            // Helper function to format with Gemini API
            async function formatWithGemini(content, apiKey, model) {
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
                
                // Get current formatting instructions from localStorage
                const formattingGuide = localStorage.getItem('formatInstructions') || DEFAULT_FORMAT_GUIDELINES;
                
                const prompt = `
                Please format the following LaTeX content according to these guidelines:
                
                ${formattingGuide}
                
                Here is the LaTeX content to format:
                
                ${content}
                
                Please provide only the formatted LaTeX content without any additional explanations or comments. Do not wrap the output in a codeblock. Just provide the plain LaTeX code.
                Do not modify the content and add explanations for terms - only format it.
                Do not remove emphasts - text can be emphasized and italicized at the same time.
                Make sure to follow the guidelines strictly.
                `;
                
                const response = await fetch(`${API_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.2,
                            topK: 40,
                            topP: 0.95,
                            maxOutputTokens: 8192
                        }
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error: ${errorData.error?.message || 'Unknown error'}`);
                }
                
                const data = await response.json();
                const formattedText = data.candidates[0]?.content?.parts?.[0]?.text;
                
                if (!formattedText) {
                    throw new Error('No formatted content received from the API');
                }
                
                return formattedText;
            }
            
            // Helper function to generate diff
            function generateDiff(original, formatted) {
                // Using diff.js to create a patch
                const diffPatch = Diff.createTwoFilesPatch('original.tex', 'formatted.tex', original, formatted, '', '');
                const configuration = { drawFileList: false, matching: 'lines', outputFormat: 'side-by-side' };

                const diff2htmlUi = new Diff2HtmlUI(targetElement, diffPatch, configuration);
                
                diff2htmlUi.draw();
                
            }
            
            // Helper function to show error messages
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }
            // File handling functions
            function addFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const fileId = 'file-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
                    const fileObj = {
                        id: fileId,
                        name: file.name,
                        originalContent: e.target.result,
                        formattedContent: null,
                        status: 'pending',
                        errorMessage: null
                    };
                    
                    files.push(fileObj);
                    renderFileList();
                    
                    // If it's the first file, make it active
                    if (files.length === 1) {
                        setActiveFile(fileId);
                    }
                };
                reader.readAsText(file);
            }

            function renderFileList() {
                fileList.innerHTML = '';
                
                if (files.length === 0) {
                    fileList.innerHTML = '<div class="file-item"><em>No files added yet</em></div>';
                    return;
                }
                
                files.forEach(file => {
                    const fileItem = document.createElement('div');
                    fileItem.className = `file-item ${file.id === activeFileId ? 'active' : ''}`;
                    fileItem.dataset.fileId = file.id;
                    
                    let statusClass = '';
                    switch (file.status) {
                        case 'pending': statusClass = 'status-pending'; break;
                        case 'processing': statusClass = 'status-processing'; break;
                        case 'processed': statusClass = 'status-processed'; break;
                        case 'error': statusClass = 'status-error'; break;
                    }
                    
                    fileItem.innerHTML = `
                        <div class="file-name">${file.name}</div>
                        <span class="file-status ${statusClass}">${file.status}</span>
                        <div class="file-actions">
                            ${file.status === 'pending' ? '<button class="format-file-btn">Format</button>' : ''}
                            <button class="remove-file-btn">Remove</button>
                        </div>
                    `;
                    
                    fileList.appendChild(fileItem);
                    
                    // Add event listeners
                    fileItem.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('format-file-btn') && 
                            !e.target.classList.contains('remove-file-btn')) {
                            setActiveFile(file.id);
                        }
                    });
                    
                    const formatFileBtn = fileItem.querySelector('.format-file-btn');
                    if (formatFileBtn) {
                        formatFileBtn.addEventListener('click', () => {
                            setActiveFile(file.id);
                            formatCurrentFile();
                        });
                    }
                    
                    const removeFileBtn = fileItem.querySelector('.remove-file-btn');
                    if (removeFileBtn) {
                        removeFileBtn.addEventListener('click', () => {
                            removeFile(file.id);
                        });
                    }
                });
                // Enable/disable download button based on processed files
                const hasProcessedFiles = files.some(file => file.status === 'processed');
                downloadAllBtn.disabled = !hasProcessedFiles;
            }

            function setActiveFile(fileId) {
                if (activeFileId) {
                    const currentFile = files.find(f => f.id === activeFileId);
                    if (currentFile && formattedOutput.value) {
                        currentFile.formattedContent = formattedOutput.value;
                    }
                }
                activeFileId = fileId;
                const file = files.find(f => f.id === fileId);
                
                if (file) {
                    // Update UI elements
                    latexInput.value = file.originalContent;
                    originalOutput.value = file.originalContent;
                    formattedOutput.value = file.formattedContent || '';
                    
                    // Update diff view if formatted content exists
                    if (file.formattedContent) {
                        generateDiff(file.originalContent, file.formattedContent);
                    } else {
                        diffOutput.innerHTML = '';
                    }
                    
                    // Update file list highlight
                    renderFileList();
                }
            }

            function removeFile(fileId) {
                const fileIndex = files.findIndex(f => f.id === fileId);
                
                if (fileIndex !== -1) {
                    files.splice(fileIndex, 1);
                    
                    // If the active file was removed, set a new active file
                    if (fileId === activeFileId) {
                        if (files.length > 0) {
                            setActiveFile(files[0].id);
                        } else {
                            activeFileId = null;
                            latexInput.value = '';
                            originalOutput.value = '';
                            formattedOutput.value = '';
                            diffOutput.innerHTML = '';
                        }
                    }
                    
                    renderFileList();
                }
            }

            async function formatCurrentFile() {
                if (!activeFileId) return;
                
                const file = files.find(f => f.id === activeFileId);
                if (!file) return;
                
                const apiKey = apiKeyInput.value.trim();
                if (!apiKey) {
                    showError("Please enter a Gemini API Key");
                    return;
                }
                
                // Update file status
                file.status = 'processing';
                renderFileList();
                
                // Show loading spinner if not batch processing
                if (!batchProcessing) {
                    loading.style.display = 'block';
                    formatBtn.disabled = true;
                    errorMessage.style.display = 'none';
                }
                
                try {
                    // Format content with Gemini API
                    const formattedContent = await formatWithGemini(file.originalContent, apiKey, modelSelect.value);
                    
                    // Update file with formatted content
                    file.formattedContent = formattedContent;
                    file.status = 'processed';
                    
                    // Update UI if this is the active file
                    if (file.id === activeFileId) {
                        originalOutput.value = file.originalContent;
                        formattedOutput.value = formattedContent;
                        generateDiff(file.originalContent, formattedContent);
                        
                        // Switch to diff tab
                        tabs.forEach(t => t.classList.remove('active'));
                        tabContents.forEach(c => c.classList.remove('active'));
                        document.querySelector('[data-tab="diff"]').classList.add('active');
                        document.getElementById('diff-content').classList.add('active');
                    }
                } catch (error) {
                    file.status = 'error';
                    file.errorMessage = error.message;
                    showError(`Error formatting ${file.name}: ${error.message}`);
                    console.error(error);
                } finally {
                    // Update file list
                    renderFileList();
                    
                    // Hide loading spinner if not batch processing
                    if (!batchProcessing) {
                        loading.style.display = 'none';
                        formatBtn.disabled = false;
                    }
                }
                
                return file.status === 'processed';
            }

            async function formatAllFiles() {
                const apiKey = apiKeyInput.value.trim();
                if (!apiKey) {
                    showError("Please enter a Gemini API Key");
                    return;
                }
                
                if (files.length === 0) {
                    showError("No files to format");
                    return;
                }
                
                // Start batch processing
                batchProcessing = true;
                let processedCount = 0;
                const totalCount = files.filter(f => f.status === 'pending').length;
                
                if (totalCount === 0) {
                    showError("No pending files to format");
                    batchProcessing = false;
                    return;
                }
                
                // Show progress bar
                batchProgress.style.display = 'block';
                formatAllBtn.disabled = true;
                
                try {
                    for (const file of files) {
                        if (file.status === 'pending') {
                            // Set as active file
                            setActiveFile(file.id);
                            
                            // Format file
                            await formatCurrentFile();
                            
                            // Update progress
                            processedCount++;
                            const progress = (processedCount / totalCount) * 100;
                            progressFill.style.width = `${progress}%`;
                            progressText.textContent = `Processing ${processedCount}/${totalCount} files...`;
                        }
                    }
                } finally {
                    // End batch processing
                    batchProcessing = false;
                    formatAllBtn.disabled = false;
                    
                    // Hide progress bar after a short delay
                    setTimeout(() => {
                        batchProgress.style.display = 'none';
                    }, 2000);
                }
            }
            // Function to download all formatted files as a zip
            async function downloadAllFiles() {
                // Check if there are any processed files
                const processedFiles = files.filter(file => file.status === 'processed');
                
                if (processedFiles.length === 0) {
                    showError("No processed files to download");
                    return;
                }
                
                try {
                    // Create a new JSZip instance
                    const zip = new JSZip();
                    
                    // Add each formatted file to the zip
                    processedFiles.forEach(file => {
                        zip.file(file.name, file.formattedContent);
                    });
                    
                    // Generate the zip file
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    
                    // Create a download link
                    const downloadLink = document.createElement('a');
                    downloadLink.href = URL.createObjectURL(zipBlob);
                    downloadLink.download = 'formatted_latex_files.zip';
                    
                    // Trigger the download
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                } catch (error) {
                    showError(`Error creating download: ${error.message}`);
                    console.error(error);
                }
            }
            // Function to save manual edits back to the file object
            function saveFormattedChanges() {
                if (!activeFileId) {
                    showError("No active file to save changes to");
                    return;
                }
                
                const file = files.find(f => f.id === activeFileId);
                if (!file) return;
                
                const newContent = formattedOutput.value;
                
                // Update the file object
                file.formattedContent = newContent;
                
                // If file wasn't already processed, mark it as processed
                if (file.status !== 'processed') {
                    file.status = 'processed';
                    renderFileList();
                }
                
                // Update the diff view
                generateDiff(file.originalContent, newContent);
                
                // Show confirmation message
                const savedMessage = document.createElement('div');
                savedMessage.textContent = 'Changes saved!';
                savedMessage.style.color = '#27ae60';
                savedMessage.style.padding = '5px';
                savedMessage.style.marginBottom = '10px';
                
                const parent = saveChangesBtn.parentElement;
                parent.appendChild(savedMessage);
                
                // Remove the message after a delay
                setTimeout(() => {
                    parent.removeChild(savedMessage);
                }, 2000);
            }
        });
    </script>
</body>
</html>
