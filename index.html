<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Žiga's Random Tools</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .tools-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .tool-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .tool-card h2 {
            color: #3498db;
            margin-top: 0;
        }
        .tool-card p {
            color: #7f8c8d;
        }
        a {
            text-decoration: none;
            color: #3498db;
        }
        a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 50px;
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Žiga's Random Tools</h1>
        <p>A collection of useful tools for various purposes.</p>
    </header>

    <div class="tools-container">
        <div class="tool-card">
            <h2>LaTeX Formatter</h2>
            <p>A tool for formatting LaTeX documents with an LLM.</p>
            <a href="./latex-formatter/latex-formatter.html">Open Tool</a>
        </div>
        
        <!-- Additional tools will be added here as they are created -->
    </div>

    <footer>
        <p>&copy; 2025 Žiga Trček - <a href="https://github.com/zigatrcek/random-tools">GitHub Repository</a></p>
    </footer>
</body>
</html>
